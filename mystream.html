<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Live Player</title>

<link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet" />
<script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-http-streaming@3.0.2/dist/videojs-http-streaming.min.js"></script>

<style>
body { margin:0; background:black; }
.video-js { width:100%; height:100vh; }
</style>
</head>

<body>

<video id="player" class="video-js vjs-default-skin" autoplay muted playsinline></video>

<script>
var player = videojs('player');

// 🔴 رابطك هنا
var streamURL = "https://h1001.hibridcdn.net/karbala/karbalatv_w82qc0GT1o2qt9wVgjkX7YDJP8Hz7UXN/playlist.m3u8";

// تحديد النوع
player.src({
    src: streamURL,
    type: "application/x-mpegURL"
});

// يبدأ صامت (إجباري حتى يشتغل)
player.muted(true);
player.play();

// بعد 5 ثواني يشتغل الصوت
setTimeout(function() {
    player.muted(false);
    player.volume(1.0);

    if (player.paused()) {
        player.play();
    }
}, 5000);

// 🔁 إذا وقف لأي سبب يرجع يشتغل
player.on('pause', function() {
    player.play();
});

// 🔁 إذا صار خطأ يعيد تحميل البث
player.on('error', function() {
    player.src({
        src: streamURL,
        type: "application/x-mpegURL"
    });
    player.play();
});
</script>

</body>
</html>
